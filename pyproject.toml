[project]
name = "agent-smith-v2"
version = "0.2.0"
description = "Local-first AI coding agent with surgical editing, configurable bash, context compaction, and Docker sandboxing."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Agent Smith Contributors"},
]
keywords = ["ai", "coding", "agent", "local", "llm", "code-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.3",
  "langchain-community>=0.3",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "openai>=1.0",
  "aiofiles>=24.0",
  "websockets>=13.0",
]

[project.urls]
Homepage = "https://github.com/agent-smith-v2/agent-smith-v2"
Repository = "https://github.com/agent-smith-v2/agent-smith-v2"
Issues = "https://github.com/agent-smith-v2/agent-smith-v2/issues"

[project.scripts]
smith2 = "smith.cli:app"
smith = "smith.cli:app"

[tool.setuptools]
packages = ["smith"]
include-package-data = true

[tool.setuptools.package-data]
smith = ["schema.sql", "static/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
